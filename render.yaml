services:
  - type: web
    name: laptopguard-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn services.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: LAPTOPGUARD_SECRET_KEY
        generateValue: true
      - key: LAPTOPGUARD_OWNER_ACCESS_KEY_HASH
        sync: false
